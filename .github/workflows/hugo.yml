# Quality gates for Moments in the Miles.
#
# This workflow does NOT deploy. The site is built and published by Netlify
# (see netlify.toml); publishing from here as well would put a second copy of
# the site on gwinn092.github.io with its own canonical URLs, which is a
# duplicate-content problem rather than a backup.
#
# What it does instead is the one thing Netlify's build cannot: prove the build
# is reproducible, by building the same commit twice and diffing the bytes.

name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      # The gates take a base URL so they can spot links pointing at the wrong
      # host. It only has to match what the build was given, not be reachable.
      BASE_URL: https://www.momentsinthemiles.com/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('static/images/**') }}
          restore-keys: |
            hugo-resources-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "$BASE_URL"

      - name: Check internal links
        run: python3 scripts/check_links.py public "$BASE_URL"

      - name: Check invariants
        run: python3 scripts/check_invariants.py public "$BASE_URL"

      # Prose that disagrees with the data under it. These all ship green and
      # read wrong: a stale count in a summary, a country inked on the map with
      # no story behind it, two pages sharing one photo.
      - name: Check content consistency
        run: python3 scripts/check_content.py

      # A second build of the same commit must produce the same bytes. When it
      # does not, something in a template is rolling dice at build time, which
      # rewrites pages on every deploy and buries real diffs in the noise.
      - name: Check the build is reproducible
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify \
            --destination public_repeat \
            --baseURL "$BASE_URL"
          if ! diff -r public public_repeat > /tmp/build-diff.txt 2>&1; then
            echo "::error::Build is not reproducible — see the differing files below."
            head -40 /tmp/build-diff.txt
            exit 1
          fi
          echo "Build is reproducible."
          rm -rf public_repeat
