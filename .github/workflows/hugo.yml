name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('static/images/**') }}
          restore-keys: |
            hugo-resources-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check internal links
        run: python3 scripts/check_links.py public "${{ steps.pages.outputs.base_url }}/"

      - name: Check invariants
        run: python3 scripts/check_invariants.py public "${{ steps.pages.outputs.base_url }}/"

      # Prose that disagrees with the data under it. These all ship green and
      # read wrong: a stale count in a summary, a country inked on the map with
      # no story behind it, two pages sharing one photo.
      - name: Check content consistency
        run: python3 scripts/check_content.py

      # A second build of the same commit must produce the same bytes. When it
      # does not, something in a template is rolling dice at build time, which
      # rewrites pages on every deploy and buries real diffs in the noise.
      - name: Check the build is reproducible
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify \
            --destination public_repeat \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
          if ! diff -r public public_repeat > /tmp/build-diff.txt 2>&1; then
            echo "::error::Build is not reproducible — see the differing files below."
            head -40 /tmp/build-diff.txt
            exit 1
          fi
          echo "Build is reproducible."
          rm -rf public_repeat

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
