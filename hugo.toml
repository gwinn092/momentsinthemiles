baseURL = "https://momentsinthemiles.com/"
locale = "en-us"
title = "Moments in the Miles"
theme = "moments"
enableRobotsTXT = true
[pagination]
  pagerSize = 10

[params]
  tagline = "Stories shaped by distance. Perspective earned by miles."
  description = "A reflective travel and lifestyle blog — part lived journal, part practical guide. Eight years of van life, all 48 continental states, eight months across Southeast Asia."
  author = "Jesse & Karlee"
  googleAnalyticsID = "G-191K9XLXV2"

# Affiliate partner IDs. Leave a value EMPTY and every link for that partner
# still renders — it just points at the plain public URL and earns nothing.
# That way the site is never broken or dishonest while an account is pending.
# Display advertising. This is SEPARATE from the affiliate/sponsorship policy in
# CLAUDE.md — that one is still confined to /guides/ and /itineraries/. Display
# ads are allowed sitewide (Jesse, Aug 12 2026) because essays are the pageview
# engine and pageviews are what a network pays for.
#
# Nothing renders until enabled = true. The slots exist now so a network can be
# dropped in later without reflowing a finished design; reserving the space is
# the part that is expensive to retrofit, not the ad tag.
[params.ads]
  enabled = false
  # Draws the reserved space with a labelled placeholder so the layout can be
  # checked without a network. Local only — never ship this true.
  preview = false
  # Sections that never carry ads whatever the above says. reduce-friction holds
  # the quiz and the $27 Kit sales page; an ad there competes with the product.
  excludeSections = ["reduce-friction"]
  # Body paragraphs required before any in-content slot is inserted at all.
  minParagraphs = 12
  # Insert an in-content slot every N top-level paragraphs.
  everyParagraphs = 9
  # Hard cap on in-content slots per page, regardless of length.
  maxInContent = 3
  # Paragraphs at the end of a post that never get a slot placed before them —
  # the end-of-content slot already covers that ground.
  tailBuffer = 3

[params.affiliates]
  # Agoda partner ("cid"). Sign in at partners.agoda.com to find it.
  agodaCid = ""
  # Booking.com affiliate id ("aid"), used as the fallback link.
  bookingAid = ""

[outputs]
  home = ["HTML", "RSS", "JSON"]

# static/images is also mounted into assets so templates can generate
# responsive srcset variants; declaring any mount replaces the defaults,
# so every standard directory must be re-declared here.
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menus]
  [[menus.main]]
    name = "Start Here"
    url = "/start-here/"
    weight = 1
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menus.main]]
    name = "Van Life"
    url = "/van-life/"
    weight = 3
  [[menus.main]]
    name = "Guides"
    url = "/guides/"
    weight = 4
  [[menus.main]]
    name = "Essays"
    url = "/essays/"
    weight = 5
  [[menus.main]]
    name = "The Map"
    url = "/map/"
    weight = 6
  [[menus.main]]
    name = "Gallery"
    url = "/gallery/"
    weight = 7
  [[menus.main]]
    name = "Reduce Friction"
    url = "/reduce-friction/"
    weight = 8
